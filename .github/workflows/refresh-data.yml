name: Refresh preparedness data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test refresh helpers
        run: python -m unittest scripts/test_refresh_helpers.py
      - name: Fetch, derive and publish candidate dataset
        run: python build_data.py
      - name: Validate candidate
        run: python scripts/validate_data.py public/data.json
      - name: Commit validated refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json public/data.json
          git diff --cached --quiet || git commit -m "data: refresh preparedness sources"
          git push
