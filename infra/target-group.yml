AWSTemplateFormatVersion: '2010-09-09'
Description: Target group and ALB listener rule for epapp-prepare-mena

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0f07641cb7f793b84
  HttpsListenerArn:
    Type: String
    Default: arn:aws:elasticloadbalancing:eu-west-1:883907968008:listener/app/ghiCd-ghilb-1I7LC2B093GEP/9eb6c96217041fcb/2248e8187ffc3dc0
  ListenerRulePriority:
    Type: Number
    Default: 21

Resources:
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: EPApp-PrepareMENA-TG
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /epapp-prepare-mena/
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /epapp-prepare-mena
              - /epapp-prepare-mena/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  TargetGroupArn:
    Value: !Ref TargetGroup
    Export:
      Name: epapp-prepare-mena-tg-arn
