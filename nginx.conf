server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;

    # Redirect bare root and no-trailing-slash
    location = / {
        return 301 /epapp-prepare-mena/;
    }

    location = /epapp-prepare-mena {
        return 301 /epapp-prepare-mena/;
    }

    # Strip sub-path prefix so all requests resolve against root
    location /epapp-prepare-mena/ {
        rewrite ^/epapp-prepare-mena/(.*)$ /$1 break;

        location ~* \.(js|css|woff2?|png|svg|ico)$ {
            rewrite ^/epapp-prepare-mena/(.*)$ /$1 break;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        try_files $uri $uri/ /index.html;
    }
}
